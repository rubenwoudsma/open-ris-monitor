municipality:
  name: Example Municipality
  slug: example
  official_identifier: gm0000
  country: NL
  website_url: https://www.example.nl
  ris_url: https://ris.example.nl
  timezone: Europe/Amsterdam

source_system:
  vendor: GemeenteOplossingen
  connector: gemeenteoplossingen
  base_url: https://ris.example.nl/api/v2/
  timeout_seconds: 30
  retry_attempts: 3
  retry_backoff_seconds: 1.0
  max_retry_delay_seconds: 60.0
  user_agent: OpenRISMonitor/0.1 (+https://github.com/rubenwoudsma/open-ris-monitor)
  allowed_redirect_hosts: []
  api_version: v2
  active: true

harvest:
  enabled: true
  schedule: daily
  from_date: "2022-01-01"
  include_meetings: true
  include_agenda_items: true
  include_documents: true
  download_documents_temporarily: true
  extract_text: true

storage:
  mode: metadata_plus_text
  commit_raw_api: true
  commit_pdf_files: false
  keep_action_artifacts_days: 3

publish:
  github_pages: true
  formats:
    - jsonl
    - json
    - csv
    - jsonld
