name: Validate

on:
  push:
    branches:
      - main
      - "milestone-*"
      - "issue-*"
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Smoke-test harvest entry points
        run: |
          python -m open_ris_monitor.diagnostics.gemeenteoplossingen_preflight --help
          python -m open_ris_monitor.diagnostics.gemeenteoplossingen_probe --help
          python -m open_ris_monitor.pipeline.run --help
          python -m open_ris_monitor.analysis.generate_public_reports --help
          python -m open_ris_monitor.exporters.generate_schemas --help
          python -m open_ris_monitor.ci.publish_summary --help

      - name: Run tests
        run: pytest

      - name: Run Ruff
        run: |
          ruff --version
          ruff check .

      - name: Validate Export Integrity
        run: python -m open_ris_monitor.exporters.validate_exports
