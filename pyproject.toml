[project]
name = "open-ris-monitor"
version = "0.1.0"
description = "Generieke open-data-pipeline voor publieke raadsinformatie uit gemeentelijke RIS-systemen."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "requests>=2.32",
    "jsonschema>=4.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff==0.15.22",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Ruff 0.16 expanded its implicit default from 59 to 413 rules. Keep the
# established project policy explicit so dependency updates cannot silently
# turn unrelated style migrations into CI blockers.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
